[project]
name = "hallucination-bench"
version = "0.1.0"
description = "HallucinationBench v2: types and severities of hallucination in activation-reading lenses"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["anthropic>=0.70", "openai>=1.50", "numpy>=1.26"]

[project.scripts]
hbench = "hallucination_bench.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
    "ruff>=0.6",
]
# plan 0003 sibling_probe: Qwen3.6-27B tokenizer + chat template (no torch needed)
sibling = ["transformers>=5.11", "jinja2>=3.1"]

[tool.uv]
default-groups = ["dev", "sibling"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hallucination_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# the plan 0003 pilot counter is a verbatim record of the pilot run (not linted)
extend-exclude = ["data/sibling_probe/pilot"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# plan 0003 one-off diagnostic sweep scripts, kept as run
"scripts/sibling_probe/probe_sweep_*.py" = ["B023", "E501", "RUF046"]
